[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2chordpro"
version = "0.1.0"
description = "音源 + AMT の MIDI（コード・調・拍）+ 歌詞 → ChordPro（歌詞付きコード譜）"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "mido",
    "pretty_midi",
    "librosa",
    "soundfile",
    "pyopenjtalk-plus[onnxruntime]",  # 「何」の読み分け
    "alkana",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    # SheetSage2 のリモートコードは transformers 5 の BartDecoder に対応していない
    "transformers>=4.45,<5",
    "mir_eval",
    "demucs>=4.1",
    # 歌詞サイトの検索（providers.lyrics）
    "requests",
    "beautifulsoup4",
    # tsumugi（providers.midi。ソースは実行時に GitHub から取得）の依存
    "dlchordx",
    "pyyaml",
    "tqdm",
    "stem-splitter",
    "chord-romanizer",
    "torchcodec<0.8",  # stem-splitter が必要とする。torch 2.8 に合う版（WAV の保存は soundfile に替えている）
    "mutagen",  # 音源のタグ（曲名・歌手・歌詞）
    # UI のサーバ（audio2chordpro serve）
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
audio2chordpro = "audio2chordpro.cli:main"

[tool.setuptools.packages.find]
include = ["audio2chordpro*"]

[tool.setuptools.package-data]
audio2chordpro = ["data/*.json"]

[tool.uv]
# PyTorch 2.8 の wheel があるもの（Intel Mac は無い）
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Windows / Linux は CUDA 12.6 版の PyTorch を使う
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest", "httpx2"]  # httpx2: FastAPI の TestClient
